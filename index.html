
<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h1>Online Quiz</h1>
        <h3 id="question">Question will appear here</h3>

        <div id="answer-buttons">
            <button class="answer">Option A</button>
            <button class="answer">Option B</button>
            <button class="answer">Option C</button>
            <button class="answer">Option D</button>
        </div>

        <p id="timer">Time: 15 seconds</p>
        <p id="score"></p>

        <button id="next-btn">Next Question</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
